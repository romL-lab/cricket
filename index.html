<!-- Chemin : /index.html -->
<!-- Rôle   : Application principale — SPA Cricket Fléchettes (MVP v3) -->
<!-- Stack  : HTML / CSS / JS vanilla — PWA offline-ready              -->
<!-- v3.7   : colonne active surlignée, clic chip = changer joueur, noms complets grille -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d1a">
  <meta name="description" content="Suivi de partie cricket fléchettes — remplace le papier-crayon">
  <link rel="manifest" href="manifest.json">
  <title>🎯 Cricket Fléchettes</title>
  <style>
    :root {
      --bg:       #0d0d1a;
      --surface:  #1a1a2e;
      --surface2: #16213e;
      --accent:   #e94560;
      --green:    #4ecca3;
      --amber:    #f59e0b;
      --text:     #eaeaea;
      --dim:      #666;
      --border:   #2a2a4a;
      --radius:   12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; overflow-x: hidden;
    }
    .screen { display: none; }
    .screen.active { display: flex; flex-direction: column; min-height: 100dvh; }

    /* ── SETUP ── */
    .setup-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100dvh; padding: 32px 24px; gap: 28px;
    }
    .logo { font-size: 52px; text-align: center; }
    .app-title { font-size: 26px; font-weight: 800; letter-spacing: -.5px; text-align: center; }
    .app-sub { font-size: 13px; color: var(--dim); text-align: center; }
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--dim);
      text-transform: uppercase; letter-spacing: 1px; text-align: center; margin-bottom: 10px;
    }
    .count-row { display: flex; gap: 10px; background: var(--surface); padding: 6px; border-radius: 50px; }
    .count-btn {
      width: 48px; height: 48px; border-radius: 50%; border: none;
      background: transparent; color: var(--dim); font-size: 20px; font-weight: 800; cursor: pointer; transition: all .2s;
    }
    .count-btn.active { background: var(--accent); color: #fff; }
    .players-form { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 340px; }
    .player-row {
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      border-radius: var(--radius); padding: 6px 16px 6px 6px; border: 1px solid var(--border);
    }
    .p-avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .player-row input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 16px; font-weight: 600; }
    .player-row input::placeholder { color: var(--dim); font-weight: 400; }
    .lang-row { display: flex; gap: 8px; }
    .lang-btn {
      padding: 9px 18px; border-radius: 50px; border: 1px solid var(--border);
      background: transparent; color: var(--dim); font-size: 14px; cursor: pointer; transition: all .2s;
    }
    .lang-btn.active { border-color: var(--green); color: var(--green); background: rgba(78,204,163,.12); }
    .start-btn {
      width: 100%; max-width: 340px; padding: 18px; background: var(--accent);
      color: #fff; border: none; border-radius: var(--radius); font-size: 18px;
      font-weight: 700; cursor: pointer; transition: opacity .2s;
    }
    .start-btn:active { opacity: .8; }

    /* ── GAME ── */
    .game-header {
      background: var(--surface); padding: 10px 12px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    .scores-bar { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .score-chip {
      display: flex; flex-direction: column; align-items: center;
      padding: 4px 14px; border-radius: 10px; background: var(--bg); min-width: 68px; transition: background .3s;
    }
    .score-chip.current { background: var(--accent); }
    .score-chip .cname { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
    .score-chip .cpts { font-size: 22px; font-weight: 800; line-height: 1.1; }

    .grid-wrap { flex: 1; overflow-y: auto; padding: 8px 10px; }
    .cgrid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .cgrid th { padding: 6px 2px; text-align: center; font-size: 11px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); }
    .cgrid .num-col { width: 52px; text-align: center; font-size: 20px; font-weight: 800; color: var(--text); padding: 8px 2px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; transition: background .15s; }
    .cgrid .num-col:active { background: rgba(233,69,96,.15); }
    .num-col.dead { color: var(--dim); }
    .cgrid .mk-cell { text-align: center; border-bottom: 1px solid var(--border); padding: 4px 2px; vertical-align: middle; }
    .cgrid .mk-cell[onclick]:active { background: rgba(233,69,96,.25); transform: scale(.93); }
    .mk-cell.closed { background: rgba(78,204,163,.08); }
    .mk-wrap { display: inline-flex; align-items: center; justify-content: center; width: 100%; }

    /* ── FOOTER ── */
    .game-footer { border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom, 0); }
    .turn-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); gap: 10px;
    }
    .turn-label { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px; }
    .turn-name  { font-size: 20px; font-weight: 800; }
    .next-btn {
      padding: 12px 20px; background: var(--green); color: #0d0d1a;
      border: none; border-radius: var(--radius); font-size: 15px; font-weight: 800;
      cursor: pointer; white-space: nowrap; transition: opacity .2s;
    }
    .next-btn:active { opacity: .8; }
    .next-btn.result-ready { background: var(--amber); }

    .mic-zone { padding: 12px 14px 4px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .mic-btn {
      width: 100%; padding: 18px 12px; background: var(--surface2);
      border: 2px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 17px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all .2s;
    }
    .mic-btn.on { border-color: var(--accent); background: rgba(233,69,96,.12); color: var(--accent); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(233,69,96,.4)} 50%{box-shadow:0 0 0 10px rgba(233,69,96,0)} }
    .mic-hint { font-size: 12px; color: var(--dim); font-style: italic; text-align: center; line-height: 1.6; }

    /* Transcript + feedback */
    .transcript-bar {
      margin: 4px 14px 0; padding: 7px 12px; background: var(--surface);
      border-radius: 8px; font-size: 13px; display: none;
    }
    .transcript-bar.visible { display: block; }
    .transcript-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
    .transcript-raw  { color: var(--dim); font-style: italic; }
    .transcript-hits { color: var(--green); font-weight: 600; margin-top: 3px; }

    .feedback { padding: 4px 16px 4px; min-height: 22px; font-size: 12px; color: var(--amber); font-style: italic; text-align: center; }

    .actions-row { display: flex; gap: 8px; padding: 6px 14px 4px; }
    .undo-btn {
      flex: 1; padding: 12px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--dim); font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity .2s;
    }
    .undo-btn:disabled { opacity: .25; cursor: not-allowed; }

    .nums-bar { display: flex; gap: 5px; padding: 4px 14px 12px; }
    .numb {
      flex: 1; padding: 11px 2px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 700;
      cursor: pointer; text-align: center; transition: all .15s;
    }
    .numb:active { background: var(--accent); border-color: var(--accent); }

    /* ── MODAL ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 200; align-items: flex-end; justify-content: center; }
    .overlay.open { display: flex; }
    .sheet { background: var(--surface); border-radius: 20px 20px 0 0; padding: 24px; width: 100%; max-width: 480px; }
    .sheet-title { font-size: 18px; font-weight: 700; text-align: center; margin-bottom: 18px; }
    .sheet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sheet-opt {
      padding: 18px 8px; border: 2px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); font-size: 17px; font-weight: 700;
      cursor: pointer; text-align: center; transition: transform .12s;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .sheet-opt:active { transform: scale(.95); }
    .sheet-opt .olabel { font-size: 11px; font-weight: 500; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
    .sheet-cancel { width: 100%; margin-top: 10px; padding: 14px; background: transparent; border: 1px solid var(--border); border-radius: var(--radius); color: var(--dim); font-size: 15px; cursor: pointer; }

    /* ── LOG SCREEN ── */
    .log-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
    }
    .log-header h2 { font-size: 18px; font-weight: 800; }
    .log-actions { display: flex; gap: 8px; }
    .log-action-btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--dim); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .2s;
    }
    .log-action-btn:hover { border-color: var(--green); color: var(--green); }
    .log-action-btn.danger:hover { border-color: var(--accent); color: var(--accent); }
    .log-back {
      padding: 8px 14px; border-radius: 8px; border: none;
      background: var(--accent); color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer;
    }
    .log-body { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .log-empty { text-align: center; color: var(--dim); font-size: 14px; padding: 60px 20px; }
    .log-stats {
      display: flex; gap: 10px; padding: 10px 12px 2px; flex-wrap: wrap;
    }
    .log-stat {
      flex: 1; min-width: 80px; background: var(--surface); border-radius: 10px;
      padding: 10px 12px; text-align: center;
    }
    .log-stat .ls-val { font-size: 22px; font-weight: 800; }
    .log-stat .ls-lbl { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .log-entry {
      background: var(--surface); border-radius: var(--radius);
      border-left: 3px solid var(--border); padding: 10px 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .log-entry.ok      { border-left-color: var(--green); }
    .log-entry.partial { border-left-color: var(--amber); }
    .log-entry.fail    { border-left-color: var(--accent); }
    .log-entry .le-meta  { font-size: 10px; color: var(--dim); display: flex; gap: 8px; }
    .log-entry .le-raw   { font-size: 13px; font-style: italic; color: var(--text); }
    .log-entry .le-hits  { font-size: 13px; font-weight: 600; color: var(--green); }
    .log-entry .le-fail  { font-size: 12px; color: var(--accent); }

    /* ── RESULT ── */
    .result-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; padding: 40px 24px; gap: 24px; text-align: center; }
    .r-trophy { font-size: 72px; }
    .r-sub { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
    .r-winner { font-size: 38px; font-weight: 800; color: var(--green); }
    .r-scores { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 8px; }
    .r-row { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 13px 16px; border-radius: var(--radius); }
    .r-row.top { border: 1px solid var(--green); }
    .r-btn { width: 100%; max-width: 320px; padding: 17px; border: none; border-radius: var(--radius); font-size: 17px; font-weight: 700; cursor: pointer; transition: opacity .2s; }
    .r-btn:active { opacity: .8; }
    .r-btn.primary { background: var(--accent); color: #fff; }
    .r-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--dim); font-size: 15px; }
  </style>
</head>
<body>

<!-- ════════ SETUP ════════ -->
<div id="s-setup" class="screen active">
  <div class="setup-wrap">
    <div class="logo">🎯</div>
    <div>
      <div class="app-title">Cricket Fléchettes</div>
      <div class="app-sub">Fini le papier-crayon !</div>
    </div>
    <div>
      <div class="section-label">Nombre de joueurs</div>
      <div class="count-row">
        <button class="count-btn" onclick="setCount(2)">2</button>
        <button class="count-btn active" onclick="setCount(3)">3</button>
        <button class="count-btn" onclick="setCount(4)">4</button>
      </div>
    </div>
    <div class="players-form" id="players-form"></div>
    <div>
      <div class="section-label">Langue vocale</div>
      <div class="lang-row">
        <button class="lang-btn active" id="l-fr" onclick="setLang('fr-FR')">🇫🇷 Français</button>
        <button class="lang-btn" id="l-en" onclick="setLang('en-US')">🇬🇧 English</button>
      </div>
    </div>
    <button class="start-btn" onclick="startGame()">Commencer ▶</button>
  </div>
</div>

<!-- ════════ GAME ════════ -->
<div id="s-game" class="screen">
  <div class="game-header">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <div class="scores-bar" id="scores-bar" style="flex:1"></div>
      <button onclick="showLog()" title="Journal vocal" style="background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;color:var(--dim);font-size:18px;cursor:pointer;flex-shrink:0">📋</button>
    </div>
  </div>
  <div class="grid-wrap">
    <table class="cgrid" id="cgrid"></table>
  </div>
  <div class="game-footer">
    <div class="turn-bar">
      <div>
        <div class="turn-label">Tour de</div>
        <div class="turn-name" id="t-name">—</div>
      </div>
      <button class="next-btn" id="next-btn" onclick="nextPlayer()">Suivant ➔</button>
    </div>
    <div class="mic-zone">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">
        <span id="mic-icon">🎤</span>
        <span id="mic-lbl">Appuyez et annoncez votre volée</span>
      </button>
      <div class="mic-hint" id="mic-hint">
        Ex : « un 20, deux 18 » · « triple 20 » · « centre » · « œil de bœuf »<br>
        Dites « suivant » pour passer au joueur suivant
      </div>
    </div>
    <div class="transcript-bar" id="transcript-bar">
      <div class="transcript-label">Reconnu</div>
      <div class="transcript-raw"  id="transcript-raw"></div>
      <div class="transcript-hits" id="transcript-hits"></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="actions-row">
      <button class="undo-btn" id="undo-btn" onclick="undoLast()" disabled>↩ Annuler la volée</button>
    </div>
    <div class="nums-bar" id="nums-bar"></div>
  </div>
</div>

<!-- ════════ RESULT ════════ -->
<div id="s-result" class="screen">
  <div class="result-wrap">
    <div class="r-trophy">🏆</div>
    <div>
      <div class="r-sub">Vainqueur</div>
      <div class="r-winner" id="r-winner">—</div>
    </div>
    <div class="r-scores" id="r-scores"></div>
    <button class="r-btn primary" onclick="playAgain()">Revanche 🔁</button>
    <button class="r-btn secondary" onclick="newGame()">Nouvelle partie</button>
  </div>
</div>

<!-- ════════ LOG ════════ -->
<div id="s-log" class="screen">
  <div class="log-header">
    <h2>📋 Journal vocal</h2>
    <div class="log-actions">
      <button class="log-action-btn" onclick="exportLog()">⬇ Export JSON</button>
      <button class="log-action-btn danger" onclick="clearLog()">🗑 Vider</button>
      <button class="log-back" onclick="show('s-game')">← Retour</button>
    </div>
  </div>
  <div class="log-stats" id="log-stats"></div>
  <div class="log-body" id="log-body"></div>
</div>

<!-- ════════ MODAL ════════ -->
<div class="overlay" id="modal">
  <div class="sheet">
    <div class="sheet-title" id="modal-title">Où touche la fléchette ?</div>
    <div class="sheet-grid">
      <button class="sheet-opt" onclick="modalPick(1)"><span>╱</span><span class="olabel">Simple · 1</span></button>
      <button class="sheet-opt" onclick="modalPick(2)"><span>✕</span><span class="olabel">Double · 2</span></button>
      <button class="sheet-opt" onclick="modalPick(3)"><span>⊗</span><span class="olabel">Triple · 3</span></button>
      <button class="sheet-opt" onclick="modalPick(0)"><span>💨</span><span class="olabel">Raté</span></button>
    </div>
    <button class="sheet-cancel" onclick="closeModal()">Annuler</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════
const NUMS   = [20, 19, 18, 17, 16, 15, 'bull'];
const VALS   = { 20:20, 19:19, 18:18, 17:17, 16:16, 15:15, bull:25 };
const COLORS     = ['#e94560','#3b82f6','#a855f7','#10b981'];
const COLORS_RGB = ['233,69,96','59,130,246','168,85,247','16,185,129'];
const EMOJIS     = ['🔴','🔵','🟣','🟢'];

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let cfg      = { count: 3, lang: 'fr-FR' };
let G        = null;
let modalNum = null;
let recog    = null;
let recogOn  = false;

// ═══════════════════════════════════════════════════════
// SETUP
// ═══════════════════════════════════════════════════════
function setCount(n) {
  cfg.count = n;
  document.querySelectorAll('.count-btn').forEach((b, i) => b.classList.toggle('active', i + 2 === n));
  buildInputs(n);
}
function setLang(l) {
  cfg.lang = l;
  document.getElementById('l-fr').classList.toggle('active', l === 'fr-FR');
  document.getElementById('l-en').classList.toggle('active', l === 'en-US');
}
function buildInputs(n) {
  const form = document.getElementById('players-form');
  const old  = [...form.querySelectorAll('input')].map(i => i.value);
  form.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'player-row';
    d.innerHTML = `
      <div class="p-avatar" style="background:${COLORS[i]}">${EMOJIS[i]}</div>
      <input type="text" placeholder="Joueur ${i+1}" value="${old[i]||''}" maxlength="14" autocorrect="off" autocapitalize="words">
    `;
    form.appendChild(d);
  }
}
function startGame() {
  const players = [...document.querySelectorAll('#players-form input')]
    .map((inp, i) => inp.value.trim() || `Joueur ${i+1}`);
  initGame(players);
  show('s-game');
  render();
}

// ═══════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════
function initGame(players) {
  G = {
    players,
    cur:    0,
    marks:  Object.fromEntries(players.map(p => [p, Object.fromEntries(NUMS.map(n => [n, 0]))])),
    scores: Object.fromEntries(players.map(p => [p, 0])),
    // hist : chaque entrée = { p, snapshot[] } → undo annule une volée entière
    hist:   [],
    winner: null,
  };
}

function applyHits(hits) {
  if (!G || G.winner || !hits.length) return;
  const p        = G.players[G.cur];
  const snapshot = hits.map(({ number, mult }) => {
    const preM = G.marks[p][number];
    // Snapshot des scores adversaires AVANT modification
    const preScores = Object.fromEntries(G.players.map(q => [q, G.scores[q]]));

    for (let i = 0; i < mult; i++) {
      if (G.marks[p][number] < 3) {
        // La case n'est pas encore fermée par le tireur → marque
        G.marks[p][number]++;
      } else {
        // Case fermée par le tireur → les adversaires qui n'ont pas fermé prennent les points
        G.players.filter(q => q !== p && G.marks[q][number] < 3)
                 .forEach(q => G.scores[q] += VALS[number]);
      }
    }
    return { number, mult, preM, preScores };
  });
  G.hist.push({ p, snapshot });
  checkWin();
  render();
}

function undoLast() {
  if (!G || !G.hist.length) return;
  const last = G.hist[G.hist.length - 1];
  if (last.p !== G.players[G.cur]) return;
  // Restaure marques + scores de tous les joueurs en ordre inverse
  for (const { number, preM, preScores } of [...last.snapshot].reverse()) {
    G.marks[last.p][number] = preM;
    for (const q of G.players) G.scores[q] = preScores[q];
  }
  G.hist.pop();
  G.winner = null;
  clearTranscript(); setFb('');
  render();
}

function nextPlayer() {
  if (!G) return;
  if (G.winner) { showResult(); return; }
  G.cur = (G.cur + 1) % G.players.length;
  clearTranscript(); setFb('');
  render();
}

function checkWin() {
  for (const p of G.players) {
    if (!NUMS.every(n => G.marks[p][n] >= 3)) continue;
    // A tout fermé — vérifie qu'aucun adversaire n'a un score inférieur
    const minOpp = Math.min(...G.players.filter(q => q !== p).map(q => G.scores[q]));
    if (G.scores[p] <= minOpp) { G.winner = p; return; }
  }
}

// ═══════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════
function render() { renderScores(); renderGrid(); renderFooter(); }

function renderScores() {
  document.getElementById('scores-bar').innerHTML = G.players.map((p, i) => `
    <div class="score-chip ${i === G.cur ? 'current' : ''}" onclick="selectPlayer(${i})" style="cursor:pointer">
      <div class="cname">${esc(trunc(p, 9))}</div>
      <div class="cpts">${G.scores[p]}</div>
    </div>
  `).join('');
}

/** Sélectionne un joueur en cliquant sur son chip. */
function selectPlayer(idx) {
  if (!G || G.winner) return;
  G.cur = idx;
  clearTranscript(); setFb('');
  render();
}

function renderGrid() {
  let h = `<thead><tr><th></th>${G.players.map((p,i)=>`<th style="color:${COLORS[i]}">${esc(p)}</th>`).join('')}</tr></thead><tbody>`;
  for (const num of NUMS) {
    const lbl     = num === 'bull' ? '🎯' : num;
    const allDead = G.players.every(p => G.marks[p][num] >= 3);
    h += `<tr>
      <td class="num-col${allDead?' dead':''}">${lbl}</td>
      ${G.players.map((p, i) => {
        const m        = G.marks[p][num];
        const isActive = i === G.cur;
        const onclick  = isActive && !G.winner ? `onclick="tapCell('${num}')"` : '';
        const colStyle = isActive
          ? `style="cursor:pointer;background:rgba(${COLORS_RGB[i]},.10)"`
          : '';
        return `<td class="mk-cell${m>=3?' closed':''}" ${onclick} ${colStyle}>
          <div class="mk-wrap">${markSVG(m)}</div>
        </td>`;
      }).join('')}
    </tr>`;
  }
  document.getElementById('cgrid').innerHTML = h + '</tbody>';
}

function renderFooter() {
  const p = G.players[G.cur];
  document.getElementById('t-name').textContent = p;
  const nb = document.getElementById('next-btn');
  nb.textContent = G.winner ? '🏆 Résultats' : 'Suivant ➔';
  nb.classList.toggle('result-ready', !!G.winner);
  const canUndo = G.hist.length > 0 && G.hist[G.hist.length-1].p === p;
  document.getElementById('undo-btn').disabled = !canUndo;
  // nums-bar supprimé — saisie directe sur la grille
  const bar = document.getElementById('nums-bar');
  if (bar) bar.style.display = 'none';
}

/**
 * Tap direct sur une cellule de la grille — ajoute 1 marque à la fois.
 * Remplace le modal simple/double/triple.
 */
function tapCell(num) {
  const number = num === 'bull' ? 'bull' : parseInt(num);
  applyHits([{ number, mult: 1 }]);
}

function markSVG(n) {
  const col = n >= 3 ? '#4ecca3' : '#eaeaea';
  let p = '';
  if (n>=1) p+=`<line x1="9" y1="9" x2="27" y2="27" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;
  if (n>=2) p+=`<line x1="27" y1="9" x2="9" y2="27" stroke="${col}" stroke-width="2.5" stroke-linecap="round"/>`;
  if (n>=3) p+=`<circle cx="18" cy="18" r="12.5" fill="none" stroke="${col}" stroke-width="2.5"/>`;
  return `<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">${p}</svg>`;
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
function openModal(num) {
  modalNum = num === 'bull' ? 'bull' : parseInt(num);
  document.getElementById('modal-title').textContent =
    `Fléchette sur le ${num === 'bull' ? 'Bull / Centre' : num}`;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); modalNum = null; }
function modalPick(mult) { closeModal(); if (mult > 0) applyHits([{ number: modalNum, mult }]); }

// ═══════════════════════════════════════════════════════
// VOICE RECOGNITION
// ═══════════════════════════════════════════════════════
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function toggleMic() {
  if (!SR) { setFb('❌ Voix non supportée — utilisez les boutons'); return; }
  recogOn ? stopRecog() : startRecog();
}

function startRecog() {
  recog = new SR();
  recog.lang = cfg.lang; recog.interimResults = false; recog.maxAlternatives = 3; recog.continuous = false;

  recog.onstart = () => {
    recogOn = true;
    document.getElementById('mic-btn').classList.add('on');
    document.getElementById('mic-icon').textContent = '🔴';
    document.getElementById('mic-lbl').textContent  = 'Écoute… annoncez votre volée';
    document.getElementById('mic-hint').textContent = 'Parlez normalement puis taisez-vous.';
    clearTranscript(); setFb('');
  };

  recog.onresult = (e) => {
    const raw = e.results[0][0].transcript;
    processVoice(raw);
  };

  recog.onerror = (e) => {
    setFb(e.error === 'no-speech' ? 'Aucune parole détectée' : `❌ ${e.error}`);
    stopRecog();
  };
  recog.onend = () => stopRecog();
  recog.start();
}

function stopRecog() {
  recogOn = false;
  try { recog?.stop(); } catch(e) {}
  document.getElementById('mic-btn').classList.remove('on');
  document.getElementById('mic-icon').textContent = '🎤';
  document.getElementById('mic-lbl').textContent  = 'Appuyez et annoncez votre volée';
  document.getElementById('mic-hint').innerHTML   =
    'Ex : « un 20, deux 18 » · « triple 20 » · « centre » · « œil de bœuf »<br>Dites « suivant » pour passer';
}

function processVoice(raw) {
  document.getElementById('transcript-raw').textContent = raw;
  document.getElementById('transcript-bar').classList.add('visible');

  const t = normalize(raw);

  // Commandes globales
  if (/\b(annuler|undo|efface)\b/.test(t))                   { undoLast();   return; }
  if (/\b(suivant|next|termine|fini|done|valide)\b/.test(t)) { nextPlayer(); return; }

  // "rien" = volée vide valide (toutes les fléchettes ratées), pas une erreur
  if (/^\s*(rien|nothing|miss|rate|rate|manque|manque|raté)\s*$/.test(t)) {
    document.getElementById('transcript-hits').textContent = '✓ Rien (volée vide)';
    document.getElementById('transcript-hits').style.color = 'var(--green)';
    setFb('');
    logEntry(raw, [], 'ok');
    return;
  }

  const { hits, lost } = parseAnnounce(t);
  const partial = hits.length > 0 && lost > 0;

  if (!hits.length) {
    logEntry(raw, [], 'fail');
    setFb('⚠ Non compris — réessayez ou utilisez les boutons');
    document.getElementById('transcript-hits').textContent = '';
    return;
  }

  // Feedback positif / partiel
  const LABELS = { bull: 'Centre' };
  const summary = hits.map(h => {
    const n = LABELS[h.number] || h.number;
    const m = h.mult === 1 ? '×1' : h.mult === 2 ? '×2' : '×3';
    return `${m} ${n}`;
  }).join('  ·  ');

  const hitsEl = document.getElementById('transcript-hits');
  if (partial) {
    hitsEl.textContent = `⚠ Partiel : ${summary}`;
    hitsEl.style.color = 'var(--amber)';
    setFb(`${lost} lancer(s) non compris — vérifiez la grille`);
  } else {
    hitsEl.textContent = `✓ ${summary}`;
    hitsEl.style.color = 'var(--green)';
    setFb('');
  }

  logEntry(raw, hits, partial ? 'partial' : 'ok');
  applyHits(hits);
}

// ═══════════════════════════════════════════════════════
// PARSER VOCAL — token-by-token, robuste aux erreurs reco
//
// Problèmes terrain gérés :
//  "de"          → alias "deux" (×2)       [reco transforme parfois "deux" en "de"]
//  "vin"         → alias "vingt" (20)       [reco tronque "vingt"]
//  "N19","en18"  → préfixe lettre supprimé  [accent du Sud]
//  "œil de bœuf" → normalisé oe/ae         [ligatures Unicode]
//  "à","au","le" → mots parasites ignorés
//  "1 17","3 16" → chiffre = multiplicateur si suivi d'un numéro de case
//  annonce sans virgule : "un 20 deux 18"   → parsé correctement
// ═══════════════════════════════════════════════════════

/** Normalisation Unicode + minuscules + suppression accents. */
function normalize(s) {
  return s
    .toLowerCase()
    .replace(/[œŒ]/g, 'oe')
    .replace(/[æÆ]/g, 'ae')
    .replace(/[éèêëÉÈÊË]/g, 'e')
    .replace(/[àâäÀÂÄ]/g, 'a')
    .replace(/[ùûüÙÛÜ]/g, 'u')
    .replace(/[ïîÏÎ]/g, 'i')
    .replace(/[ôöÔÖ]/g, 'o')
    .replace(/[çÇ]/g, 'c')
    .trim();
}

/**
 * Découpe l'annonce sur virgules / "et" / "puis",
 * puis parse chaque segment.
 * Retourne { hits: [{number,mult}], lost: number }
 */
function parseAnnounce(t) {
  const results = t
    .replace(/\s+(et|and|puis|then)\s+/g, ',')
    .split(/\s*[,;\/]\s*/)
    .map(s => s.trim()).filter(Boolean)
    .map(parseSegment);

  return {
    hits: results.flatMap(r => r.hits),
    lost: results.reduce((acc, r) => acc + r.lost, 0),
  };
}

/**
 * Parse un segment en une ou plusieurs touches.
 * Retourne { hits, lost } où lost = nb de tokens non résolus.
 */
function parseSegment(s) {
  s = normalize(s);

  // ── Pré-traitement : remplace les expressions multi-mots bull par tokens ──
  // "oeil de boeuf" / "oeil" → DBULL (= 2 marques sur bull, fixe)
  s = s.replace(/\b(oeil\s+de\s+b[oe]+f)\b/g, 'DBULL');
  s = s.replace(/\boeil\b/g, 'DBULL');
  // "double bull/bulle/centre" → DBULL
  s = s.replace(/\b(double\s+bull|double\s+bulle|double\s+centre)\b/g, 'DBULL');

  // ── Segment = uniquement bull seul (sans modificateur) ──────────────────
  // Pluriels, alias phonétiques
  if (/^(bull|bulles?|boules?|bulle|centres?|cents?|san|sente|25|50)$/.test(s))
    return { hits:[{ number:'bull', mult:1 }], lost:0 };

  // ── Nettoyage tokens ─────────────────────────────────────────────────────
  const NOISE = new Set(['a','au','le','la','les','sur','dans','mon','son','ou','or','mais']);

  const tokens = s
    .split(/\s+/)
    .filter(Boolean)
    .map(t => t.replace(/^[a-z]{1,2}(\d{2})$/, '$1'))
    .flatMap(t => /^\d{4,}$/.test(t) ? splitDigitRun(t) : [t])
    .flatMap(t => /^\d{3}$/.test(t) ? splitMult3(t) : [t])
    .flatMap(t => splitCompound(t))
    .filter(t => !/^\d+$/.test(t) ? !NOISE.has(t) : true);

  const hits = [];
  let lost = 0;
  let i = 0;

  while (i < tokens.length) {
    const mult = parseMult(tokens[i]);

    if (mult !== null) {
      const num = parseNum(tokens, i + 1);
      if (num) {
        // DBULL force toujours ×2 (un oeil de boeuf = 2 marques, toujours)
        const finalMult = num.value === 'DBULL' ? 2 : mult;
        hits.push({ number: num.value === 'DBULL' ? 'bull' : num.value, mult: finalMult });
        i += 1 + num.consumed;
      } else {
        // Multiplicateur orphelin en fin de segment → ne pas compter comme perdu
        const isLast = (i === tokens.length - 1);
        if (!isLast) lost++;
        i++;
      }
    } else {
      const num = parseNum(tokens, i);
      if (num) {
        const finalMult = num.value === 'DBULL' ? 2 : 1;
        hits.push({ number: num.value === 'DBULL' ? 'bull' : num.value, mult: finalMult });
        i += num.consumed;
      } else {
        if (/\d/.test(tokens[i])) lost++;
        i++;
      }
    }
  }

  return { hits, lost };
}

/**
 * Reconnaît un multiplicateur depuis un token.
 * Gère les pluriels (triples, doubles, simples) et alias de reco.
 */
function parseMult(tok) {
  if (!tok) return null;
  if (/^(un|une|simples?|singles?|1)$/.test(tok))       return 1;
  if (/^(deux|de|doubles?|di|d|2)$/.test(tok))          return 2;  // "de","di" = "deux" mal reconnu
  if (/^(trois|triples?|trebles?|tri|tr|3)$/.test(tok)) return 3;  // "triples" pluriel géré
  return null;
}

/**
 * Découpe une suite ≥4 chiffres en numéros de cases valides.
 * "191816" → ["19","18","16"] | "1716300" → ["17","16"] (300 ignoré)
 */
function splitDigitRun(s) {
  const VALID = new Set([15,16,17,18,19,20]);
  const result = [];
  let i = 0;
  while (i < s.length) {
    if (i + 1 >= s.length) break; // chiffre isolé → stop (ne bloque plus)
    const two = parseInt(s.slice(i, i + 2), 10);
    if (VALID.has(two)) { result.push(String(two)); i += 2; }
    else { i++; } // caractère non reconnu → on avance sans bloquer
  }
  return result.length ? result : [s];
}

/**
 * Token 3 chiffres : tente mult (1-3) + numéro de case (15-20).
 * "315" → ["3","15"] | "120" → ["1","20"] | "319" → ["319"] (19 ok mais 3 comme mult)
 */
function splitMult3(s) {
  const VALID = new Set(['15','16','17','18','19','20']);
  const m = s[0];
  const n = s.slice(1);
  if (/^[123]$/.test(m) && VALID.has(n)) return [m, n];
  return [s];
}

/**
 * Découpe les tokens composés collés issus de la reco vocale.
 * "devin"   → ["de","vin"]   (deux vingt = ×2 20)
 * "unvin"   → ["un","vin"]   (un vingt  = ×1 20)
 * "troisvin"→ ["trois","vin"] (triple 20)
 * Autres    → [token inchangé]
 */
function splitCompound(t) {
  const MULTS = ['trois','triple','deux','double','de','di','un','une'];
  const NUMS  = ['vingt','vin','quinze','seize','dix-sept','dix-huit','dix-neuf',
                 'centre','centres','bulle','bulles','boule','boules','bull',
                 'fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
  for (const m of MULTS) {
    if (t.startsWith(m) && t.length > m.length) {
      const rest = t.slice(m.length);
      if (NUMS.some(n => rest === n || rest.startsWith(n))) return [m, rest];
    }
  }
  return [t];
}

/**
 * Reconnaît un numéro de case à partir de la position i.
 * Gère les tokens composés (dix sept → 17).
 * @returns {{ value, consumed }} ou null
 */
function parseNum(tokens, i) {
  if (i >= tokens.length) return null;
  const t0 = tokens[i]     || '';
  const t1 = tokens[i + 1] || '';

  // Deux tokens collés : dix + sept/huit/neuf
  const TWO_MAP = {
    'dix sept':17, 'dix-sept':17,
    'dix huit':18, 'dix-huit':18,
    'dix neuf':19, 'dix-neuf':19,
  };
  const twoKey = `${t0} ${t1}`;
  if (TWO_MAP[twoKey] !== undefined) return { value: TWO_MAP[twoKey], consumed: 2 };
  if (TWO_MAP[t0]     !== undefined) return { value: TWO_MAP[t0],     consumed: 1 };

  // Un seul token
  const ONE_MAP = {
    '15':15, 'quinze':15,   'fifteen':15,
    '16':16, 'seize':16,    'sixteen':16,
    '17':17, 'seventeen':17,
    '18':18, 'eighteen':18,
    '19':19, 'nineteen':19,
    '20':20, 'vingt':20,    'vin':20,   'twenty':20,
    // Bull — toutes les variantes terrain
    'bull':'bull', 'bulles':'bull', 'bulle':'bull',
    'boule':'bull', 'boules':'bull',          // alias phonétique très fréquent
    'centre':'bull', 'centres':'bull',
    'cents':'bull', 'cent':'bull',
    '25':'bull', '50':'bull',
    // DBULL = oeil de boeuf pré-processé (toujours ×2, géré dans parseSegment)
    'DBULL':'DBULL',
  };
  if (ONE_MAP[t0] !== undefined) return { value: ONE_MAP[t0], consumed: 1 };

  return null;
}

// ═══════════════════════════════════════════════════════
// LOG VOCAL — persistance localStorage
// Chaque entrée : { ts, raw, hits, ok, player }
// ═══════════════════════════════════════════════════════
const LOG_KEY = 'cricket-voice-log';

function loadLog()        { try { return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch { return []; } }
function saveLog(entries) { try { localStorage.setItem(LOG_KEY, JSON.stringify(entries)); } catch {} }

/**
 * Enregistre une tentative vocale.
 * @param {string} raw    - transcript brut
 * @param {Array}  hits   - touches parsées
 * @param {string} status - 'ok' | 'partial' | 'fail'
 */
function logEntry(raw, hits, status = 'fail') {
  const entries = loadLog();
  entries.unshift({
    ts:     new Date().toISOString(),
    player: G ? G.players[G.cur] : '—',
    raw, hits, status,
    // Rétrocompat : ok = true si ok ou partial
    ok: status !== 'fail',
  });
  if (entries.length > 500) entries.length = 500;
  saveLog(entries);
}

function showLog() {
  const entries = loadLog();
  const total   = entries.length;
  const ok      = entries.filter(e => e.status === 'ok').length;
  const partial = entries.filter(e => e.status === 'partial').length;
  const fail    = entries.filter(e => e.status === 'fail').length;
  const rate    = total ? Math.round((ok / total) * 100) : 0;

  document.getElementById('log-stats').innerHTML = `
    <div class="log-stat"><div class="ls-val">${total}</div><div class="ls-lbl">Total</div></div>
    <div class="log-stat"><div class="ls-val" style="color:var(--green)">${ok}</div><div class="ls-lbl">OK</div></div>
    <div class="log-stat"><div class="ls-val" style="color:var(--amber)">${partial}</div><div class="ls-lbl">Partiel</div></div>
    <div class="log-stat"><div class="ls-val" style="color:var(--accent)">${fail}</div><div class="ls-lbl">Échec</div></div>
    <div class="log-stat"><div class="ls-val">${rate}%</div><div class="ls-lbl">Taux OK</div></div>
  `;

  if (!entries.length) {
    document.getElementById('log-body').innerHTML =
      '<div class="log-empty">Aucune tentative vocale enregistrée.</div>';
  } else {
    const LABELS = { bull:'Centre' };
    document.getElementById('log-body').innerHTML = entries.map(e => {
      const d      = new Date(e.ts);
      const time   = d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
      const status = e.status || (e.ok ? 'ok' : 'fail'); // rétrocompat
      const hitsStr = (e.hits || []).map(h => {
        const n = LABELS[h.number] || h.number;
        const m = ['','×1','×2','×3'][h.mult] || `×${h.mult}`;
        return `${m} ${n}`;
      }).join('  ·  ');

      const badge = status === 'ok'      ? `<div class="le-hits">✓ ${esc(hitsStr)}</div>`
                  : status === 'partial' ? `<div class="le-hits" style="color:var(--amber)">⚠ Partiel : ${esc(hitsStr)}</div>`
                  :                       `<div class="le-fail">✗ Non compris</div>`;

      return `
        <div class="log-entry ${status}">
          <div class="le-meta"><span>${time}</span><span>👤 ${esc(e.player)}</span></div>
          <div class="le-raw">« ${esc(e.raw)} »</div>
          ${badge}
        </div>
      `;
    }).join('');
  }

  show('s-log');
}

function exportLog() {
  const entries = loadLog();
  const blob    = new Blob([JSON.stringify(entries, null, 2)], { type: 'application/json' });
  const url     = URL.createObjectURL(blob);
  const a       = document.createElement('a');
  a.href        = url;
  a.download    = `cricket-voice-log-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function clearLog() {
  if (!confirm('Vider tout le journal ?')) return;
  saveLog([]);
  showLog();
}

// ═══════════════════════════════════════════════════════
// RESULT
// ═══════════════════════════════════════════════════════
function showResult() {
  const sorted = [...G.players].sort((a, b) => {
    const ac = NUMS.every(n => G.marks[a][n] >= 3);
    const bc = NUMS.every(n => G.marks[b][n] >= 3);
    // Ceux qui ont tout fermé en premier, puis tri par score croissant
    if (ac && !bc) return -1; if (!ac && bc) return 1;
    return G.scores[a] - G.scores[b];
  });
  const w = G.winner || sorted[0];
  document.getElementById('r-winner').textContent = w;
  document.getElementById('r-scores').innerHTML   = sorted.map((p, i) => `
    <div class="r-row ${p===w?'top':''}">
      <span>${['🥇','🥈','🥉','4️⃣'][i]} ${esc(p)}</span>
      <span style="font-weight:800">${G.scores[p]} pts reçus</span>
    </div>
  `).join('');
  show('s-result');
}
function playAgain() { initGame([...G.players].reverse()); show('s-game'); render(); }
function newGame()   { show('s-setup'); }

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function setFb(msg) { document.getElementById('feedback').textContent = msg; }
function clearTranscript() {
  document.getElementById('transcript-bar').classList.remove('visible');
  document.getElementById('transcript-raw').textContent  = '';
  document.getElementById('transcript-hits').textContent = '';
}
function trunc(s, n) { return s.length > n ? s.slice(0, n) + '…' : s; }
function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
